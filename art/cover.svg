<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1b2450"/>
      <stop offset="50%" stop-color="#0b1020"/>
      <stop offset="100%" stop-color="#2a1b4a"/>
    </linearGradient>
    <linearGradient id="disc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="38%" r="60%">
      <stop offset="0%" stop-color="rgba(99,102,241,0.45)"/>
      <stop offset="100%" stop-color="rgba(99,102,241,0)"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <rect width="512" height="512" fill="url(#glow)"/>
  <!-- Vinyl disc -->
  <g transform="translate(256,250)">
    <circle r="168" fill="url(#disc)" opacity="0.22"/>
    <circle r="140" fill="url(#disc)"/>
    <circle r="140" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="2"/>
    <circle r="118" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>
    <circle r="96" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>
    <circle r="74" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>
    <circle r="52" fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="1.5"/>
    <circle r="34" fill="#0b1020"/>
    <text x="0" y="12" text-anchor="middle" font-family="Georgia, serif" font-weight="bold" font-size="30" fill="#fff">🎵</text>
  </g>
  <!-- Equalizer bars -->
  <g transform="translate(256,466)">
    <rect x="-36" y="-22" width="10" height="22" rx="5" fill="#ffd76a"/>
    <rect x="-18" y="-34" width="10" height="34" rx="5" fill="#8b5cf6"/>
    <rect x="0"   y="-44" width="10" height="44" rx="5" fill="#6366f1"/>
    <rect x="18"  y="-30" width="10" height="30" rx="5" fill="#8b5cf6"/>
    <rect x="36"  y="-16" width="10" height="16" rx="5" fill="#ffd76a"/>
  </g>
  <!-- Title -->
  <text x="256" y="80" text-anchor="middle" font-family="Georgia, serif" font-weight="bold" font-size="46" fill="#fff">Bible Songs</text>
  <text x="256" y="112" text-anchor="middle" font-family="sans-serif" font-size="20" letter-spacing="4" fill="rgba(255,255,255,0.55)">24/7 · WORSHIP · PSALMS</text>
</svg>
